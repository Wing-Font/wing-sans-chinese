# Generated by `python3 build.py --config` — edit tools/families.py instead.
# Run `python3 build.py --fetch-only` first so mappings/ exists.
recipe:
  fonts/ttf/WingSansYueJyutping-Regular.ttf:
    - source: srcfonts/NotoSansHK[wght].ttf
    - operation: exec
      exe: wing-font
      args: >-
        -i $in -a 'srcfonts/NotoSans[wdth,wght].ttf' -m mappings/cantonese/canto-lshk.csv -f 'Wing Sans Yue Jyutping' -opt --no-woff2 --font-version 1.001 --copyright-line 'Copyright 2026 The Wing Sans Project Authors (https://github.com/Wing-Font/wing-sans-chinese)' --anno-axis wdth=75 -as 0.39 -bs 0.70 -y 0.70 --diy-annotations mappings/cantonese/lshk.diy-annotation.csv --mark-x-offset -0.125 -o fonts/ttf/WingSansYueJyutping-Regular
  fonts/ttf/WingSansYueYale-Regular.ttf:
    - source: srcfonts/NotoSansHK[wght].ttf
    - operation: exec
      exe: wing-font
      args: >-
        -i $in -a 'srcfonts/NotoSans[wdth,wght].ttf' -m mappings/cantonese/canto-yale.csv -f 'Wing Sans Yue Yale' -opt --no-woff2 --font-version 1.001 --copyright-line 'Copyright 2026 The Wing Sans Project Authors (https://github.com/Wing-Font/wing-sans-chinese)' --anno-axis wdth=75 -as 0.39 -bs 0.70 -y 0.70 -o fonts/ttf/WingSansYueYale-Regular
  fonts/ttf/WingSansGuoyuPinyin-Regular.ttf:
