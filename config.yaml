    - operation: exec
      exe: wing-font
      args: >-
        -i $in -a 'srcfonts/NotoSans[wdth,wght].ttf' -m mappings/taiwanese/taigi-tl-toned.csv -f 'Wing Sans Taigi Tailo' -opt --no-woff2 --font-version 1.001 --copyright-line 'Copyright 2026 The Wing Sans Project Authors (https://github.com/Wing-Font/wing-sans-chinese)' --anno-axis wdth=75 -as 0.39 -bs 0.70 -y 0.70 --diy-annotations mappings/taiwanese/sutian.diy-annotation.csv --mark-x-offset -0.125 -o fonts/ttf/WingSansTaigiTailo-Regular
